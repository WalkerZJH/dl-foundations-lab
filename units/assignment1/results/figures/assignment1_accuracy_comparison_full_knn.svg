<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">Assignment 1 Accuracy Comparison with Full kNN Subset</title>
  <desc id="desc">Validation and test accuracy for kNN, Softmax, TwoLayerNet, and FullyConnectedNet. kNN uses train=2000, validation=500, test=500.</desc>
  <rect width="900" height="540" fill="#ffffff"/>
  <text x="450" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">Assignment 1 Accuracy Comparison</text>
  <text x="450" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#4b5563">kNN uses full current subset: train=2000, val=500, test=500</text>
  <line x1="90" y1="440" x2="840" y2="440" stroke="#111827" stroke-width="1.5"/>
  <line x1="90" y1="100" x2="90" y2="440" stroke="#111827" stroke-width="1.5"/>
  <g font-family="Arial, sans-serif" font-size="12" fill="#374151">
    <text x="80" y="444" text-anchor="end">0.00</text>
    <text x="80" y="376" text-anchor="end">0.10</text>
    <text x="80" y="308" text-anchor="end">0.20</text>
    <text x="80" y="240" text-anchor="end">0.30</text>
    <text x="80" y="172" text-anchor="end">0.40</text>
    <text x="80" y="104" text-anchor="end">0.50</text>
  </g>
  <g stroke="#e5e7eb" stroke-width="1">
    <line x1="90" y1="372" x2="840" y2="372"/>
    <line x1="90" y1="304" x2="840" y2="304"/>
    <line x1="90" y1="236" x2="840" y2="236"/>
    <line x1="90" y1="168" x2="840" y2="168"/>
    <line x1="90" y1="100" x2="840" y2="100"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#111827">
    <rect x="150" y="249.6" width="44" height="190.4" fill="#2563eb"/>
    <rect x="198" y="282.24" width="44" height="157.76" fill="#f59e0b"/>
    <text x="172" y="244" text-anchor="middle">0.280</text>
    <text x="220" y="276" text-anchor="middle">0.232</text>
    <text x="196" y="470" text-anchor="middle">kNN</text>

    <rect x="320" y="230.56" width="44" height="209.44" fill="#2563eb"/>
    <rect x="368" y="238.72" width="44" height="201.28" fill="#f59e0b"/>
    <text x="342" y="225" text-anchor="middle">0.308</text>
    <text x="390" y="233" text-anchor="middle">0.296</text>
    <text x="366" y="470" text-anchor="middle">Softmax</text>

    <rect x="490" y="248.24" width="44" height="191.76" fill="#2563eb"/>
    <rect x="538" y="252.32" width="44" height="187.68" fill="#f59e0b"/>
    <text x="512" y="243" text-anchor="middle">0.282</text>
    <text x="560" y="247" text-anchor="middle">0.276</text>
    <text x="536" y="470" text-anchor="middle">TwoLayerNet</text>

    <rect x="660" y="245.52" width="44" height="194.48" fill="#2563eb"/>
    <rect x="708" y="282.24" width="44" height="157.76" fill="#f59e0b"/>
    <text x="682" y="240" text-anchor="middle">0.286</text>
    <text x="730" y="276" text-anchor="middle">0.232</text>
    <text x="706" y="470" text-anchor="middle">FullyConnectedNet</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="13" fill="#111827">
    <rect x="610" y="72" width="18" height="18" fill="#2563eb"/>
    <text x="636" y="86">Validation</text>
    <rect x="720" y="72" width="18" height="18" fill="#f59e0b"/>
    <text x="746" y="86">Test</text>
  </g>
</svg>
